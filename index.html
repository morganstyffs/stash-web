<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('stash.prefs.theme');
          var mode = stored ? JSON.parse(stored) : 'light';
          if (mode === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {
          /* localStorage unavailable (private mode / quota) — default to light */
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Favicons / app icons (files live in /public), หน้าปัดตู้เซฟ brand mark v2.
         The <link rel="manifest"> is injected automatically by vite-plugin-pwa, so
         it is not repeated here. Modern browsers take the SVG; the 16/32 PNGs cover
         the rest; legacy clients auto-fetch /favicon.ico (also shipped, new mark). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- App surface colour, one per scheme — the app has light + dark modes, so a
         single fixed value is always wrong in one of them. Values mirror
         --color-surface in src/styles/index.css (light: 246 243 236, dark:
         23 22 15); this is the app background, NOT the accent. Keep in step with
         that file and vite.config.ts. (Was the old palette's mint #14B8A6.) -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F6F3EC" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#17160F" />
    <meta name="description" content="Stash — บันทึกรายรับ-รายจ่ายส่วนตัว + กึ่งระบบสต็อกสินค้า" />

    <!-- Social preview -->
    <meta property="og:title" content="Stash" />
    <meta property="og:description" content="บันทึกรายรับ-รายจ่ายส่วนตัว + กึ่งระบบสต็อกสินค้า" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/preview_web.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/preview_web.png" />

    <!-- Prompt font (design system) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <title>Stash</title>

    <!-- Boot splash shown in the blank gap before React mounts (matters most for
         a PWA opened from the home screen). Pure HTML/CSS — no JS, no app bundle
         needed — and it clears itself: createRoot().render() in src/main.tsx
         replaces #root's children on first paint. Colours are inlined because the
         app CSS may not have loaded yet; they mirror src tokens — page bg =
         --color-surface (index.css: light 246 243 236 / dark 23 22 15, keyed off
         the same html.dark the inline theme script above sets), and the mark is
         the BrandMark full geometry in mint #5CBFA3 / brand #4A57B5 / white. -->
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f6f3ec; /* mirrors --color-surface (light) */
      }
      html.dark #boot-splash {
        background: #17160f; /* mirrors --color-surface (dark) */
      }
      /* Lift the indigo dial in dark mode so it clears 3:1 on the dark bg —
         mirrors --color-dial dark (90 104 201) in src/styles/index.css. */
      html.dark #boot-splash .dial {
        fill: #5a68c9;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash" aria-hidden="true">
        <!-- BrandMark variant="full" (see src/components/BrandMark.tsx) inlined
             as static SVG. Kept in sync by hand — it is the only no-JS copy. -->
        <svg width="72" height="72" viewBox="0 0 64 64" fill="none">
          <circle cx="27.9" cy="32" r="23" stroke="#5CBFA3" stroke-width="4" />
          <g stroke="#5CBFA3" stroke-width="3.3" stroke-linecap="round">
            <line x1="36.74" y1="23.16" x2="40.27" y2="19.63" />
            <line x1="19.06" y1="23.16" x2="15.53" y2="19.63" />
            <line x1="36.74" y1="40.84" x2="40.27" y2="44.37" />
            <line x1="19.06" y1="40.84" x2="15.53" y2="44.37" />
          </g>
          <line x1="59.1" y1="26" x2="59.1" y2="38" stroke="#5CBFA3" stroke-width="3.85" stroke-linecap="round" />
          <circle class="dial" cx="27.9" cy="32" r="9.1" fill="#4A57B5" />
          <g fill="none" stroke="#FFFFFF" stroke-width="2.05" stroke-linecap="round">
            <line x1="24.65" y1="28.6" x2="24.65" y2="30.5" />
            <line x1="31.15" y1="28.6" x2="31.15" y2="30.5" />
            <path d="M24.1 33.9 Q27.9 37.6 31.7 33.9" />
          </g>
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
