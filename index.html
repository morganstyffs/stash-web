<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('stash.prefs.theme');
          var mode = stored ? JSON.parse(stored) : 'light';
          if (mode === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {
          /* localStorage unavailable (private mode / quota) — default to light */
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Favicons / app icons (files live in /public). The <link rel="manifest">
         is injected automatically by vite-plugin-pwa, so it is not repeated here. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/stash-mark.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Brand indigo (คราม). Keep in step with tailwind.config.ts → brand.DEFAULT
         and vite.config.ts BRAND_THEME_COLOR — this follows the palette, it is
         not a free value. (Was the old palette's mint #14B8A6.) -->
    <meta name="theme-color" content="#4A57B5" />
    <meta name="description" content="Stash — บันทึกรายรับ-รายจ่ายส่วนตัว + กึ่งระบบสต็อกสินค้า" />

    <!-- Social preview -->
    <meta property="og:title" content="Stash" />
    <meta property="og:description" content="บันทึกรายรับ-รายจ่ายส่วนตัว + กึ่งระบบสต็อกสินค้า" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/preview_web.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/preview_web.png" />

    <!-- Prompt font (design system) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <title>Stash</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
