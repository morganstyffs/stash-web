name: CI

# Build + test every PR and every push to main so neither a type error nor a
# broken money formula can reach production. `npm run build` = `tsc -b && vite
# build`, i.e. the exact command Cloudflare runs — the real check. `npm test` =
# `vitest run` over the pure compute functions (ledger, home/stock/budget
# aggregates).
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Full compile + bundle. No VITE_SUPABASE_* needed: those are read at
      # runtime in the browser, not during the build.
      - run: npm run build
      # Chromium for the WovenHero visual-regression guard — a real-browser check
      # (elementFromPoint) that jsdom can't do. Installs the exact build this
      # playwright-core expects so the guard resolves it itself, no path guessing.
      # Without this the guard fails in CI on purpose (a guard that can only skip
      # is no guard); with it, the guard actually runs.
      - run: npx playwright-core install --with-deps chromium
      # Unit tests for the money/stock formulas + the visual guard (Vitest). Uses
      # dummy Supabase env from vitest.config.ts — no live project needed.
      - run: npm test
