name: Types drift check

# The owner has no dev machine, so src/lib/database.types.ts is regenerated from
# the Supabase dashboard and pasted in by hand after every migration. When that
# step is missed the DB and the repo silently diverge — which is exactly what
# happened with 0015 (schema applied to the DB, migration + types never reached
# main, nothing flagged it).
#
# This job closes that gap: nightly (and on demand) it regenerates the types from
# the LIVE database and, if they differ from the committed file, opens a PR with
# the regenerated file. Identical → it does nothing and stays silent, so it never
# becomes noise people learn to ignore.
#
# It does NOT touch main directly: main is protected (docs/BRANCH_PROTECTION.md)
# and a "types changed" PR is precisely the signal we want (plus the owner no
# longer has to copy-paste).
#
# Types come from `supabase gen types typescript --project-id`, which is a thin
# client over the Supabase Management API — the SAME generator the dashboard uses.
# So header, ordering and formatting match the hand-pasted file, and this doesn't
# fire every night over cosmetic differences. (This is separate from ci.yml by
# design and adds no deploy step.)
#
# Required secrets (Settings → Secrets and variables → Actions):
#   • SUPABASE_ACCESS_TOKEN — a Supabase personal access token
#       (supabase.com → Account → Access Tokens → Generate new token)
#   • SUPABASE_PROJECT_ID   — the project ref, e.g. abcdefghijklmno
#       (Supabase → Project Settings → General → Reference ID)
# Optional:
#   • GH_PAT — a GitHub token (repo scope). If set, the drift PR is opened with it
#       so CI (the `build` check) runs on the PR and it becomes mergeable under
#       branch protection. Without it the PR still opens (the signal), but the
#       default GITHUB_TOKEN can't trigger ci.yml, so you'd re-run CI manually.
# See docs/TYPES_DRIFT.md for the full walkthrough.

on:
  schedule:
    # 18:00 UTC = 01:00 Asia/Bangkok — once a night is enough.
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: types-drift
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fail loudly and helpfully if the secrets aren't set, rather than letting
      # the CLI die with an opaque auth error further down.
      - name: Verify required secrets are set
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          missing=()
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then missing+=("SUPABASE_ACCESS_TOKEN"); fi
          if [ -z "$SUPABASE_PROJECT_ID" ]; then missing+=("SUPABASE_PROJECT_ID"); fi
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required secret(s): ${missing[*]}"
            echo "Set them under Settings → Secrets and variables → Actions:"
            echo "  • SUPABASE_ACCESS_TOKEN — Supabase personal access token (Account → Access Tokens)"
            echo "  • SUPABASE_PROJECT_ID   — project ref (Project Settings → General → Reference ID)"
            exit 1
          fi
          echo "Both required secrets are present."

      - name: Install the Supabase CLI
        # The CLI version doesn't change the output here (the types are generated
        # server-side by the Management API), so tracking the action's latest CLI
        # is safe and keeps the command interface current.
        uses: supabase/setup-cli@v1

      - name: Regenerate database.types.ts from the live database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase gen types typescript \
            --project-id "${{ secrets.SUPABASE_PROJECT_ID }}" \
            > src/lib/database.types.ts.new
          # Guard against an empty/truncated response silently overwriting the file.
          if [ ! -s src/lib/database.types.ts.new ]; then
            echo "::error::Generated types file is empty — check the access token and project ref."
            exit 1
          fi
          mv src/lib/database.types.ts.new src/lib/database.types.ts

      - name: Detect drift
        id: drift
        run: |
          if git diff --quiet -- src/lib/database.types.ts; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "✅ database.types.ts already matches the live schema — nothing to do."
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo "⚠️ database.types.ts differs from the live schema:"
            git --no-pager diff --stat -- src/lib/database.types.ts
          fi

      - name: Open a PR with the regenerated types
        if: steps.drift.outputs.drift == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          # Prefer a PAT so ci.yml runs on the PR (see the header note); fall back
          # to GITHUB_TOKEN so the PR still opens without extra setup.
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          base: main
          branch: automation/database-types-drift
          # Reuse one branch/PR so a persisting drift updates the existing PR
          # instead of piling up a new one every night.
          delete-branch: true
          add-paths: src/lib/database.types.ts
          commit-message: 'chore(types): sync database.types.ts with the live schema'
          title: 'chore(types): database.types.ts drift from the live schema'
          labels: types-drift
          body: |
            The nightly **types drift check** found `src/lib/database.types.ts` out
            of sync with the live Supabase schema and regenerated it from the
            Management API (the same generator the dashboard uses).

            Most likely a migration was applied to the DB but the regenerated types
            were never pasted back into the repo (the `0015` failure mode).

            **What to do:** review the diff. If it reflects a real schema change,
            confirm the matching migration is committed under `supabase/migrations/`,
            then merge. If the diff looks purely cosmetic, see `docs/TYPES_DRIFT.md`.

            🤖 Opened automatically by `.github/workflows/types-drift.yml`.
